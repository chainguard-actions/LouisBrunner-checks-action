name: "Update aggregate tags"
on:
  push:
    tags:
      - "v*.*"

permissions: {}

jobs:
  retag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Calculate short tag name
        id: calculate_short_tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TRUNC_VER=$(printf '%s' "$REF_NAME" | tr -d '\n\r' | cut -d '.' -f 1)
          echo "Short tag: $TRUNC_VER"
          safe_tag=$(printf '%s' "$TRUNC_VER" | tr -d '\n\r')
          echo "tag=$safe_tag" >> "$GITHUB_OUTPUT"
      - uses: rickstaa/action-create-tag@a1c7777fcb2fee4f19b0f283ba888afa11678b72 # v1
        with:
          force_push_tag: true
          tag: "${{ steps.calculate_short_tag.outputs.tag }}"
          message: "Points to ${{ github.ref_name }}"
