name: Test rich output with annotations and images
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        continue-on-error: true
        uses: .
        with:
          token: fake-token-for-testing
          name: rich-output-check
          status: completed
          conclusion: neutral
          output: |
            {"title": "Check Results", "summary": "All checks passed"}
          output_text_description_file: >-
            ${{ github.workspace }}/actions/hardened/LouisBrunner--checks-action/v1.6.2/tests/fixtures/check-output.txt
          annotations: |
            [{"path": "src/main.js", "start_line": 1, "end_line": 1, "annotation_level": "notice", "message": "Test annotation"}]
          images: |
            [{"alt": "Test image", "image_url": "https://example.com/image.png"}]
      - name: Assert action ran with rich output inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail with a fake token (API call fails), which is expected
          # We just verify the action ran and produced an outcome
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
