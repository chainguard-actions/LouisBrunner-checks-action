name: Test action_url, details_url, and actions inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        continue-on-error: true
        uses: .
        with:
          token: fake-token-for-testing
          name: action-required-check
          status: completed
          conclusion: action_required
          action_url: https://example.com/callback
          details_url: https://example.com/details
          actions: |
            [{"label": "Fix", "description": "Fix the issue", "identifier": "fix"}]
      - name: Assert action ran with action_url, details_url, and actions inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail with a fake token (API call fails), which is expected
          # We just verify the action ran and produced an outcome
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
