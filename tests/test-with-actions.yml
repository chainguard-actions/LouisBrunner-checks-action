name: Test actions input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: test-actions-input-check
          status: completed
          conclusion: action_required
          action_url: https://github.com/actions/checkout
          actions: |
            [
              {
                "label": "Fix",
                "description": "Fix the issue",
                "identifier": "fix"
              }
            ]
      - name: Assert check_id is set
        env:
          CHECK_ID: ${{ steps.action.outputs.check_id }}
        run: |
          echo "check_id: $CHECK_ID"
          if [ -z "$CHECK_ID" ]; then
            echo "FAIL: expected check_id to be set"
            exit 1
          fi
          echo "PASS"
