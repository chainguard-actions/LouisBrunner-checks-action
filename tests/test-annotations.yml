name: Test check with annotations and images
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: test-check-annotations
          conclusion: neutral
          status: completed
          output: |
            {"title": "Annotation Test", "summary": "Check with annotations and images"}
          annotations: |
            [{"path": "README.md", "start_line": 1, "end_line": 1, "annotation_level": "notice", "message": "Test annotation"}]
          images: |
            [{"alt": "Test image", "image_url": "https://example.com/image.png"}]
      - name: Assert check_id output is set
        env:
          CHECK_ID: ${{ steps.action.outputs.check_id }}
        run: |
          echo "check_id: $CHECK_ID"
          if [ -z "$CHECK_ID" ]; then
            echo "FAIL: expected check_id to be non-empty"
            exit 1
          fi
          echo "PASS"
