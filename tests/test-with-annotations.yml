name: Test check with annotations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock GitHub API server
        run: |
          cat > /tmp/mock_api_18083.py << 'PYEOF'
          import http.server, json

          class Handler(http.server.BaseHTTPRequestHandler):
              def log_message(self, fmt, *args): pass
              def do_POST(self):
                  self.rfile.read(int(self.headers.get('Content-Length', 0)))
                  self.send_response(201)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'id': 55, 'name': 'test-check-annotations'}).encode())
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'id': 55, 'name': 'test-check-annotations'}).encode())
              def do_PATCH(self):
                  self.rfile.read(int(self.headers.get('Content-Length', 0)))
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'id': 55, 'name': 'test-check-annotations'}).encode())

          http.server.HTTPServer(('localhost', 18083), Handler).serve_forever()
          PYEOF
          python3 /tmp/mock_api_18083.py &
          sleep 1
          echo "Mock server started on port 18083"

      - id: action
        uses: .
        env:
          INTERNAL_TESTING_MODE_HTTP_LOCAL_PORT: "18083"
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "test-check-annotations"
          conclusion: neutral
          status: completed
          sha: ${{ github.sha }}
          output: |
            {"title": "Lint Results", "summary": "Found some issues"}
          annotations: |
            [{"path": "README.md", "start_line": 1, "end_line": 1, "annotation_level": "notice", "message": "Test annotation"}]

      - name: Assert check_id is set
        env:
          CHECK_ID: ${{ steps.action.outputs.check_id }}
        run: |
          echo "check_id: $CHECK_ID"
          if [ -z "$CHECK_ID" ]; then
            echo "FAIL: expected check_id to be non-empty"
            exit 1
          fi
          if ! echo "$CHECK_ID" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected check_id to be numeric, got: $CHECK_ID"
            exit 1
          fi
          echo "PASS: check with annotations created, check_id=$CHECK_ID"
