name: Test check creation with conclusion
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_SHA: abc123def456abc123def456abc123def456abc1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock GitHub API server
        run: |
          python3 -c "
          import http.server, json, threading

          class Handler(http.server.BaseHTTPRequestHandler):
              def log_message(self, format, *args):
                  pass
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  self.rfile.read(length)
                  self.send_response(201)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'id': 789, 'name': 'test-check-conclusion', 'status': 'completed', 'conclusion': 'success'}).encode())
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'id': 789, 'name': 'test-check-conclusion', 'status': 'completed', 'conclusion': 'success'}).encode())
              def do_PATCH(self):
                  length = int(self.headers.get('Content-Length', 0))
                  self.rfile.read(length)
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'id': 789, 'name': 'test-check-conclusion', 'status': 'completed', 'conclusion': 'success'}).encode())

          server = http.server.HTTPServer(('localhost', 0), Handler)
          port = server.server_address[1]
          with open('/tmp/mock_server_port', 'w') as f:
              f.write(str(port))
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()
          import time
          time.sleep(300)
          " &
          for i in $(seq 1 20); do
            if [ -f /tmp/mock_server_port ]; then
              break
            fi
            sleep 0.2
          done
          PORT=$(cat /tmp/mock_server_port)
          echo "Mock server started on port $PORT"
          echo "MOCK_PORT=$PORT" >> $GITHUB_ENV

      - id: create_check
        uses: .
        env:
          INTERNAL_TESTING_MODE_HTTP_LOCAL_PORT: ${{ env.MOCK_PORT }}
        with:
          token: fake-token-for-testing
          name: "test-check-conclusion"
          status: completed
          conclusion: success

      - name: Assert check_id is non-empty
        env:
          CHECK_ID: ${{ steps.create_check.outputs.check_id }}
        run: |
          echo "check_id: $CHECK_ID"
          if [ -z "$CHECK_ID" ]; then
            echo "FAIL: expected check_id to be non-empty"
            exit 1
          fi
          echo "PASS: check_id=$CHECK_ID"
