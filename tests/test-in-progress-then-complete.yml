name: Test in-progress check then complete
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock GitHub API server
        run: |
          cat > /tmp/mock_api_18082.py << 'PYEOF'
          import http.server, json

          class Handler(http.server.BaseHTTPRequestHandler):
              def log_message(self, fmt, *args): pass
              def do_POST(self):
                  self.rfile.read(int(self.headers.get('Content-Length', 0)))
                  self.send_response(201)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'id': 77, 'name': 'test-check-in-progress'}).encode())
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'id': 77, 'name': 'test-check-in-progress'}).encode())
              def do_PATCH(self):
                  self.rfile.read(int(self.headers.get('Content-Length', 0)))
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'id': 77, 'name': 'test-check-in-progress'}).encode())

          http.server.HTTPServer(('localhost', 18082), Handler).serve_forever()
          PYEOF
          python3 /tmp/mock_api_18082.py &
          sleep 1
          echo "Mock server started on port 18082"

      - name: Create in-progress check
        id: create
        uses: .
        env:
          INTERNAL_TESTING_MODE_HTTP_LOCAL_PORT: "18082"
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "test-check-in-progress"
          status: in_progress
          sha: ${{ github.sha }}

      - name: Assert check_id from create step
        env:
          CHECK_ID: ${{ steps.create.outputs.check_id }}
        run: |
          echo "check_id: $CHECK_ID"
          if [ -z "$CHECK_ID" ]; then
            echo "FAIL: expected check_id to be non-empty after creating in-progress check"
            exit 1
          fi
          if ! echo "$CHECK_ID" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected check_id to be numeric, got: $CHECK_ID"
            exit 1
          fi
          echo "PASS: in-progress check created with check_id=$CHECK_ID"

      - name: Update check to completed
        id: update
        uses: .
        env:
          INTERNAL_TESTING_MODE_HTTP_LOCAL_PORT: "18082"
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          check_id: ${{ steps.create.outputs.check_id }}
          conclusion: success
          status: completed
          sha: ${{ github.sha }}

      - name: Assert update step succeeded
        env:
          ORIGINAL_ID: ${{ steps.create.outputs.check_id }}
        run: |
          echo "original check_id: $ORIGINAL_ID"
          if [ -z "$ORIGINAL_ID" ]; then
            echo "FAIL: original check_id is empty"
            exit 1
          fi
          echo "PASS: check updated successfully, original check_id=$ORIGINAL_ID"
