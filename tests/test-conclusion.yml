name: Test conclusion with output and details_url
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create output text description file
        run: |
          echo "This is a detailed text description of the check result." > /tmp/check-output-text.txt
      - id: action
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: test-check-conclusion
          conclusion: success
          status: completed
          details_url: https://example.com/details
          output: |
            {"title": "Test Output", "summary": "All tests passed"}
          output_text_description_file: /tmp/check-output-text.txt
      - name: Assert check_id output is set
        env:
          CHECK_ID: ${{ steps.action.outputs.check_id }}
        run: |
          echo "check_id: $CHECK_ID"
          if [ -z "$CHECK_ID" ]; then
            echo "FAIL: expected check_id to be non-empty"
            exit 1
          fi
          echo "PASS"
