name: Test update check using check_id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create initial check
        id: create
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: test-check-update
          status: in_progress
      - name: Assert initial check_id is set
        env:
          CHECK_ID: ${{ steps.create.outputs.check_id }}
        run: |
          echo "initial check_id: $CHECK_ID"
          if [ -z "$CHECK_ID" ]; then
            echo "FAIL: expected check_id to be non-empty after creation"
            exit 1
          fi
          echo "PASS"
      - name: Update check using check_id
        id: update
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          check_id: ${{ steps.create.outputs.check_id }}
          conclusion: success
          status: completed
      - name: Assert updated check_id matches
        env:
          ORIGINAL_ID: ${{ steps.create.outputs.check_id }}
          UPDATED_ID: ${{ steps.update.outputs.check_id }}
        run: |
          echo "original check_id: $ORIGINAL_ID"
          echo "updated check_id: $UPDATED_ID"
          if [ -z "$UPDATED_ID" ]; then
            echo "FAIL: expected updated check_id to be non-empty"
            exit 1
          fi
          echo "PASS"
